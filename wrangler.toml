name = "jarvis-proxi"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Optional runtime vars (secrets like ANTHROPIC_API_KEY go via `wrangler secret put`)
[vars]
# Comma-separated list of origins allowed by CORS. Include your GH Pages URL
# and any localhost you develop against.
ALLOWED_ORIGINS = "https://benmor042012-maker.github.io,http://localhost:8787,http://127.0.0.1:8787"
# Explicit off-switch for paid tools. Set to "true" only if you intentionally
# wire a paid tool and want it to run. Free tools ignore this.
PAID_TOOLS_ENABLED = "false"
# Morning briefing: local hour (Asia/Jerusalem) at which JARVIS "calls" you.
BRIEFING_HOUR = "6"
# Which user's memory/Google account the briefing + Telegram bot use.
BRIEFING_USER_ID = "effi"
# Secrets (wrangler secret put ...): ANTHROPIC_API_KEY, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, TELEGRAM_BOT_TOKEN, OWNER_ID

# D1: SQLite at the edge — stores memories + reminders.
[[d1_databases]]
binding = "DB"
database_name = "jarvis-memory"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# Vectorize: semantic retrieval index.
[[vectorize]]
binding = "VECTORIZE"
index_name = "jarvis-memories"

# Workers AI: free tier for bge-m3 embeddings (1024 dims, Hebrew-friendly).
[ai]
binding = "AI"

# Cron: every minute, fire due reminders. Every hour on the hour, check whether
# it's BRIEFING_HOUR local time and run the morning briefing. Nightly at 03:00
# UTC, consolidate memory.
[triggers]
crons = ["* * * * *", "0 * * * *", "0 3 * * *"]
