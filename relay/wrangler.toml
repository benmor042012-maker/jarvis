name = "jarvis-relay"
main = "worker.js"
compatibility_date = "2025-01-01"

# One Durable Object per room. The SQLite backend is what makes Durable Objects
# available on the Workers free plan.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
