<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050911;
    --bg2:#0a1424;
    --blue:#3ecbff;
    --blue-deep:#0a84ff;
    --glow:#9df3ff;
    --violet:#a78bfa;
    --text:#eaf6ff;
    --muted:#5f7d99;
    --pulse-speed:3.2s;
    --ring-color:var(--blue);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(ellipse at 50% 30%, var(--bg2) 0%, var(--bg) 65%);
    font-family:'Rubik',sans-serif;
    color:var(--text);
    overflow:hidden;
  }
  .stage{
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:24px;
    position:relative;
  }
  /* faint scanning grid backdrop */
  .stage::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(62,203,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62,203,255,0.05) 1px, transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(ellipse at 50% 40%, black 0%, transparent 70%);
    pointer-events:none;
  }
  .orb-wrap{
    position:relative;
    width:min(66vw, 380px);
    height:min(66vw, 380px);
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .orb-wrap svg{width:100%;height:100%;overflow:visible;}
  .ring{
    fill:none;
    stroke:var(--ring-color);
    transition:stroke 0.6s ease;
  }
  .ring-outer{stroke-width:1.4;opacity:0.4;animation:spin 50s linear infinite;transform-origin:200px 200px;}
  .ring-dots{stroke-width:3;opacity:0.5;stroke-linecap:round;animation:spin 60s linear infinite reverse;transform-origin:200px 200px;}
  .ring-brackets{stroke:var(--ring-color);opacity:0.55;stroke-linecap:round;transition:stroke 0.6s ease;}
  .ring-mid{stroke-width:2;opacity:0.55;animation:spin 22s linear infinite reverse;transform-origin:200px 200px;}
  .ring-inner{stroke-width:2.5;opacity:0.8;animation:spin 14s linear infinite;transform-origin:200px 200px;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .wordmark{
    font-family:'Orbitron',sans-serif;
    font-weight:700;
    font-size:23px;
    letter-spacing:3.5px;
    fill:var(--glow);
    direction:ltr;
    transition:fill 0.6s ease;
  }
  .state-thinking .wordmark{fill:var(--violet);}
  .state-alarm .wordmark{fill:#ff8a4c;}

  .bar{
    stroke:var(--ring-color);
    stroke-width:2.5;
    stroke-linecap:round;
    transition:stroke 0.6s ease;
  }

  .core-glow{
    fill:url(#coreGradient);
    animation:pulse var(--pulse-speed) ease-in-out infinite;
    transform-origin:200px 200px;
  }
  @keyframes pulse{
    0%,100%{transform:scale(0.92);opacity:0.85;}
    50%{transform:scale(1.05);opacity:1;}
  }

  .state-thinking .ring{stroke:var(--violet);}
  .state-thinking .ring-inner{animation-duration:2.5s;}
  .state-thinking .ring-mid{animation-duration:4s;}
  .state-speaking .ring{stroke:var(--glow);}
  .state-listening .ring{stroke:var(--blue);}
  .state-alarm .ring{stroke:#ff8a4c;animation-duration:0.6s !important;}
  .state-alarm .core-glow{animation-duration:0.5s !important;}

  .status{
    font-size:16px;
    font-weight:500;
    letter-spacing:0.5px;
    color:var(--text);
    min-height:22px;
    text-align:center;
  }
  .hint{
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:0.3px;
  }

  .log{
    width:min(92vw, 520px);
    max-height:22vh;
    overflow-y:auto;
    font-size:13.5px;
    line-height:1.6;
    color:var(--muted);
    padding:0 6px;
    scrollbar-width:thin;
  }
  .log::-webkit-scrollbar{width:5px;}
  .log::-webkit-scrollbar-thumb{background:rgba(62,203,255,0.25);border-radius:4px;}
  .log p{margin:4px 0;}
  .log .me{color:var(--blue);}
  .log .me::before{content:"אתה: ";opacity:0.7;}
  .log .ai{color:var(--glow);}
  .log .ai::before{content:"JARVIS: ";opacity:0.7;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:1px;direction:ltr;display:inline-block;}

  .fallback{
    display:none;
    width:min(92vw, 420px);
    gap:8px;
    flex-direction:row;
  }
  .fallback.active{display:flex;}
  .fallback input{
    flex:1;
    background:rgba(62,203,255,0.06);
    border:1px solid rgba(62,203,255,0.3);
    border-radius:10px;
    padding:10px 14px;
    color:var(--text);
    font-family:'Rubik',sans-serif;
    font-size:14px;
    outline:none;
  }
  .fallback input:focus{border-color:var(--blue);}
  .fallback button{
    background:var(--blue-deep);
    border:none;
    border-radius:10px;
    color:#031018;
    font-weight:700;
    padding:0 18px;
    cursor:pointer;
    font-family:'Rubik',sans-serif;
  }
  .notice{
    font-size:11.5px;
    color:var(--muted);
    max-width:min(90vw,420px);
    text-align:center;
    opacity:0.75;
    line-height:1.5;
  }

  .wake-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    padding:6px 12px;
    border:1px solid rgba(62,203,255,0.25);
    border-radius:999px;
    background:rgba(62,203,255,0.04);
    transition:border-color 0.3s, color 0.3s;
  }
  .wake-toggle .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--muted);
    transition:background 0.3s, box-shadow 0.3s;
  }
  .wake-toggle.on{color:var(--blue);border-color:rgba(62,203,255,0.6);}
  .wake-toggle.on .dot{background:var(--blue);box-shadow:0 0 8px var(--blue);animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.35;}}

  .log a.open-link{color:var(--blue);text-decoration:underline;}
</style>
</head>
<body>
<div class="stage">

  <div class="orb-wrap state-idle" id="orbWrap" title="לחץ כדי לדבר">
    <svg viewBox="0 0 400 400">
      <defs>
        <radialGradient id="coreGradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#bdf6ff" stop-opacity="0.35"/>
          <stop offset="45%" stop-color="#3ecbff" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#3ecbff" stop-opacity="0"/>
        </radialGradient>
        <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4.5" result="blur1"/>
          <feMerge>
            <feMergeNode in="blur1"/>
            <feMergeNode in="blur1"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- outer fine tick ring -->
      <circle class="ring ring-outer" cx="200" cy="200" r="188" stroke-dasharray="1.5 6"/>
      <!-- dotted ring -->
      <circle class="ring ring-dots" cx="200" cy="200" r="172" stroke-dasharray="1 11" stroke-width="4"/>
      <!-- corner brackets, four cardinal accents -->
      <g class="ring ring-brackets" stroke-width="3">
        <path d="M 200 8 L 200 26 M 191 12 L 209 12" fill="none"/>
        <path d="M 200 392 L 200 374 M 191 388 L 209 388" fill="none"/>
        <path d="M 8 200 L 26 200 M 12 191 L 12 209" fill="none"/>
        <path d="M 392 200 L 374 200 M 388 191 L 388 209" fill="none"/>
      </g>

      <circle class="ring ring-mid" cx="200" cy="200" r="150" stroke-dasharray="5 9"/>
      <circle class="ring ring-inner" cx="200" cy="200" r="122" stroke-dasharray="26 12"/>
      <g id="bars"></g>
      <circle class="core-glow" cx="200" cy="200" r="95"/>

      <text class="wordmark" x="200" y="207" text-anchor="middle" filter="url(#neonGlow)">J.A.R.V.I.S</text>
    </svg>
  </div>

  <div class="status" id="statusText">מוכן לשמוע אותך</div>
  <div class="hint" id="hintText">לחץ על העיגול כדי לדבר</div>

  <div class="wake-toggle" id="wakeToggle" title="כשמופעל, JARVIS מקשיב ברקע ל&quot;היי ג'רוויס&quot; או &quot;תתעורר&quot;">
    <span class="dot"></span>
    <span id="wakeToggleLabel">הפעל האזנה תמידית (מילת עוררות)</span>
  </div>

  <div class="wake-toggle" id="desktopToggle" title="חיבור לאפליקציית JARVIS במחשב — רק היא יכולה לשלוט במחשב">
    <span class="dot" id="desktopDot" style="background:#64748b"></span>
    <span id="desktopLabel">לא מחובר למחשב</span>
  </div>

  <div class="fallback" id="desktopSetup" style="display:none">
    <input type="text" id="desktopTokenInput" placeholder="הדבק כאן את ה-Connection Token מהגדרות אפליקציית ג'רביס">
    <button id="desktopConnectBtn">חבר</button>
  </div>

  <div class="fallback" id="fallback">
    <input type="text" id="textInput" placeholder="כתוב הודעה ל-JARVIS...">
    <button id="sendBtn">שלח</button>
  </div>

  <div class="log" id="log"></div>

  <div class="notice" id="notice"></div>
</div>

<script>
(function(){
  const orbWrap = document.getElementById('orbWrap');
  const statusText = document.getElementById('statusText');
  const hintText = document.getElementById('hintText');
  const log = document.getElementById('log');
  const barsGroup = document.getElementById('bars');
  const fallback = document.getElementById('fallback');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const notice = document.getElementById('notice');
  const wakeToggle = document.getElementById('wakeToggle');
  const wakeToggleLabel = document.getElementById('wakeToggleLabel');

  const SYSTEM_PROMPT = "אתה JARVIS, עוזר AI חכם, שנון ורגוע בסגנון הסרטים של איירון מן. אתה עונה תמיד בעברית, בקצרה ולעניין (1-3 משפטים בדרך כלל, אלא אם התבקש הסבר ארוך), בביטחון עצמי מסוים ומעט הומור יבש, בלי להיות מוגזם. אתה יכול לפנות למשתמש בכבוד קליל. אל תשתמש באימוג'ים.";

  // ---------- server proxy that holds the API key (deploy worker.js OR chat.js) ----------
  // After deploying, paste your proxy URL here, e.g.
  //   "https://jarvis-proxy.YOURNAME.workers.dev"   (Cloudflare Worker)
  //   "https://YOURPROJECT.vercel.app/api/chat"      (Vercel function)
  const PROXY_URL = "https://jarvis-proxi.ben-mor-04-2012.workers.dev";

  // ---------- people JARVIS can message (fill in real numbers once) ----------
  // Local ("05...") or international. Israel is assumed for local numbers.
  // You can also add a contact by voice: "תזכור שהמספר של אבא הוא 050...".
  const CONTACTS = {
    // "אבא": "0501234567",
    // "אמא": "0521234567",
  };
  function loadContacts(){
    let saved = {};
    try{ saved = JSON.parse(localStorage.getItem('jarvis_contacts')||'{}'); }catch(e){}
    return Object.assign({}, CONTACTS, saved);
  }
  function saveContact(name, number){
    let saved = {};
    try{ saved = JSON.parse(localStorage.getItem('jarvis_contacts')||'{}'); }catch(e){}
    saved[name] = number;
    try{ localStorage.setItem('jarvis_contacts', JSON.stringify(saved)); }catch(e){}
  }
  function waNumber(raw){
    let d = String(raw||'').replace(/\D/g,'');
    if(d.startsWith('00')) d = d.slice(2);
    else if(d.startsWith('0')) d = '972' + d.slice(1); // Israel default
    return d;
  }

  let history = [];
  let state = 'idle'; // idle | listening | thinking | speaking
  let recognition = null;
  let audioCtx, analyser, micSource, rafId;
  let sttSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  let ttsSupported = 'speechSynthesis' in window;

  // ---------- Hebrew TTS voice (robust to Chrome's async voice loading) ----------
  let heVoice = null;
  let voiceWarned = false;
  function pickHebrewVoice(){
    const voices = speechSynthesis.getVoices();
    if(!voices || !voices.length) return null;
    return voices.find(v=>v.lang && v.lang.toLowerCase()==='he-il')
        || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('he'))
        || voices.find(v=>/hebrew|עברית/i.test(v.name||''))
        || null;
  }
  function loadVoices(){
    heVoice = pickHebrewVoice();
    if(!heVoice && !voiceWarned && speechSynthesis.getVoices().length){
      voiceWarned = true;
      notice.textContent = 'לא נמצא קול עברי מותקן במכשיר; אשתמש בקול ברירת המחדל. אפשר להתקין קול עברי בהגדרות המערכת.';
    }
  }
  if(ttsSupported){
    loadVoices();
    // fires when the browser finishes loading the voice list (often after first paint)
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  // ---------- wake word mode ----------
  let wakeMode = false;       // is "always listening" toggled on
  let recogAlive = false;     // is the speech recognizer currently alive
  let lastRecogStart = 0;     // when it last actually started
  let commandUntil = 0;       // when the 2-minute conversation window ends
  let restartTimer = null;

  const WAKE_PHRASES = ["היי גרביס","היי ג'רביס","היי ג'רוויס","היי גארוויס","היי ג'ארוויס","ג'רוויס תתעורר","גרביס תתעורר","תתעורר","היי גרוויס","הי גרביס","הייי גרביס"];

  function containsWakePhrase(text){
    const t = text.replace(/\s+/g,' ').trim();
    return WAKE_PHRASES.some(p => t.includes(p));
  }

  // ============================================================
  //  LOCAL COMMAND ENGINE  (intent registry - 100% offline)
  //  Each intent = { name, test(t) -> match|false, run(t, match) }.
  //  The router tries them in order; first match wins. Adding a new
  //  command means adding ONE object to COMMANDS below - nothing
  //  here needs the internet or the Claude brain, so it all works
  //  on a plain GitHub Pages deploy.
  // ============================================================

  let speechRate = 1.02;          // adjustable by voice ("דבר לאט/מהר")
  const activeAlarms = [];        // { id, label }

  // speak + log + push-to-history, in one place
  function respond(userText, replyText, opts){
    opts = opts || {};
    if(userText != null) addLog('user', userText);
    addLog('assistant', replyText);
    if(userText != null) history.push({ role:'user', content:userText });
    history.push({ role:'assistant', content:replyText });
    if(!opts.noSpeak) speak(replyText);
  }

  function round(x){ return Math.round(x*1000)/1000; }
  function loadNotes(){ try{ return JSON.parse(localStorage.getItem('jarvis_notes')||'[]'); }catch(e){ return []; } }
  function saveNotes(a){ try{ localStorage.setItem('jarvis_notes', JSON.stringify(a)); }catch(e){} }

  // Hebrew number words -> digits (helps voice input: "שמונה" -> 8)
  const HE_NUM = {'אפס':0,'אחת':1,'אחד':1,'שתיים':2,'שניים':2,'שתי':2,'שני':2,'שלוש':3,'שלושה':3,'ארבע':4,'ארבעה':4,'חמש':5,'חמישה':5,'שש':6,'שישה':6,'שבע':7,'שבעה':7,'שמונה':8,'תשע':9,'תשעה':9,'עשר':10,'עשרה':10,'עשרים':20,'שלושים':30,'ארבעים':40,'חמישים':50,'שישים':60,'מאה':100};
  function wordsToDigits(t){ return t.replace(/[א-ת]+/g, w => (w in HE_NUM ? HE_NUM[w] : w)); }

  // ---------- site / app map ----------
  const APP_MAP = [
    { keys:["יוטיוב","youtube"], url:"https://www.youtube.com", label:"יוטיוב" },
    { keys:["וואטסאפ","whatsapp","ווצאפ"], url:"https://web.whatsapp.com", label:"וואטסאפ" },
    { keys:["ג'ימייל","gmail","מייל","דואר"], url:"https://mail.google.com", label:"ג'ימייל" },
    { keys:["מפות","נביגציה","ניווט","waze","וויז"], url:"https://www.google.com/maps", label:"מפות גוגל" },
    { keys:["ספוטיפיי","spotify","מוזיקה"], url:"https://open.spotify.com", label:"ספוטיפיי" },
    { keys:["נטפליקס","netflix"], url:"https://www.netflix.com", label:"נטפליקס" },
    { keys:["פייסבוק","facebook"], url:"https://www.facebook.com", label:"פייסבוק" },
    { keys:["אינסטגרם","instagram","אינסטה"], url:"https://www.instagram.com", label:"אינסטגרם" },
    { keys:["טיקטוק","tiktok"], url:"https://www.tiktok.com", label:"טיקטוק" },
    { keys:["טלגרם","telegram"], url:"https://web.telegram.org", label:"טלגרם" },
    { keys:["לינקדאין","linkedin"], url:"https://www.linkedin.com", label:"לינקדאין" },
    { keys:["טוויטר","twitter","אקס"], url:"https://x.com", label:"X" },
    { keys:["רדיט","reddit"], url:"https://www.reddit.com", label:"רדיט" },
    { keys:["ויקיפדיה","וויקיפדיה","wikipedia"], url:"https://he.wikipedia.org", label:"ויקיפדיה" },
    { keys:["דרייב","drive"], url:"https://drive.google.com", label:"גוגל דרייב" },
    { keys:["קלנדר","יומן","לוח שנה","calendar"], url:"https://calendar.google.com", label:"יומן גוגל" },
    { keys:["גיטהאב","github"], url:"https://github.com", label:"גיטהאב" },
    { keys:["צ'אט גיפיטי","chatgpt","גיפיטי"], url:"https://chat.openai.com", label:"ChatGPT" },
    { keys:["ג'מיני","gemini"], url:"https://gemini.google.com", label:"Gemini" },
    { keys:["קלוד","claude"], url:"https://claude.ai", label:"Claude" }
  ];

  function openUrl(userText, url, label){
    const win = window.open(url, '_blank');
    if(win){
      respond(userText, "פותח את " + label + ", אדוני.");
    } else {
      // voice-triggered opens have no click gesture -> popup blocked. Offer a link.
      addLog('user', userText);
      const reply = "הדפדפן חסם את החלון. לחץ כאן לפתיחת " + label + ": ";
      addLog('assistant', reply);
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.className = 'open-link'; a.textContent = label;
      log.lastElementChild.appendChild(a);
      history.push({ role:'user', content:userText });
      history.push({ role:'assistant', content:reply });
      speak("הדפדפן חסם את החלון, שמתי לך לינק לפתיחה.");
    }
  }

  // ---------- alarm / reminder helpers ----------
  const UNIT_MS = { 'שנייה':1000,'שניות':1000,'דקה':60000,'דקות':60000,'שעה':3600000,'שעות':3600000 };
  function beep(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=880; g.gain.value=0.15;
      o.connect(g); g.connect(ctx.destination); o.start();
      setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
    }catch(e){}
  }
  function fireAlarm(label){
    addLog('assistant', "\u23f0 התזכורת שלך " + label + " הגיעה!");
    beep();
    document.documentElement.style.setProperty('--ring-color','#ff8a4c');
    speak("אדוני, הגיע הזמן. זו התזכורת שביקשת.");
    setTimeout(()=>document.documentElement.style.removeProperty('--ring-color'), 6000);
  }

  // ---------- the intent registry ----------
  const COMMANDS = [

    // stop talking
    { name:'stop_speaking',
      test:t=>/^(שקט|תשתוק|תפסיק לדבר|תפסיק|די)\s*$/.test(t),
      run:t=>{ speechSynthesis.cancel(); addLog('user',t); if(wakeMode) armSleepListening(); else setState('idle'); } },

    // set reminder (relative "בעוד 10 דקות" / absolute "בשעה 8:00")
    { name:'set_reminder',
      test:t=>{
        if(!/תזכיר|תזכורת|טיימר|שעון מעורר|תעיר|עורר אותי|תצפצף/.test(t)) return false;
        const n = wordsToDigits(t);
        let m = n.match(/בעוד\s+(\d+)?\s*(שנייה|שניות|דקה|דקות|שעה|שעות)/);
        if(m){ const q=m[1]?parseInt(m[1],10):1; return { ms:q*UNIT_MS[m[2]], kind:'rel' }; }
        m = n.match(/(?:בשעה|ב-?)\s*(\d{1,2})(?::(\d{2}))?/);
        if(m){
          const hh=parseInt(m[1],10), mm=m[2]?parseInt(m[2],10):0;
          if(hh<24 && mm<60){
            const now=new Date(), tgt=new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm,0,0);
            if(tgt<=now) tgt.setDate(tgt.getDate()+1);
            return { ms:tgt-now, kind:'abs', target:tgt };
          }
        }
        return { ms:null };
      },
      run:(t,m)=>{
        if(m.ms==null){ respond(t,"לא הבנתי לאיזו שעה. נסה \"תזכיר לי בעוד 10 דקות\" או \"תזכיר לי בשעה שמונה\"."); return; }
        const label = m.kind==='abs'
          ? "לשעה "+String(m.target.getHours()).padStart(2,'0')+":"+String(m.target.getMinutes()).padStart(2,'0')
          : (m.ms>=60000 ? "בעוד "+Math.round(m.ms/60000)+" דקות" : "בעוד "+Math.round(m.ms/1000)+" שניות");
        const id = setTimeout(()=>{
          fireAlarm(label);
          const i=activeAlarms.findIndex(a=>a.id===id); if(i>-1) activeAlarms.splice(i,1);
        }, m.ms);
        activeAlarms.push({ id, label });
        respond(t, "קבעתי תזכורת "+label+", אדוני.");
      } },

    // cancel / list reminders
    { name:'cancel_reminders',
      test:t=>/בטל.*תזכור|תבטל.*תזכור|בטל.*טיימר|מחק.*תזכור/.test(t),
      run:t=>{ const n=activeAlarms.length; activeAlarms.forEach(a=>clearTimeout(a.id)); activeAlarms.length=0;
        respond(t, n ? ("ביטלתי "+n+" תזכורות.") : "אין תזכורות פעילות כרגע."); } },
    { name:'list_reminders',
      test:t=>/כמה תזכורות|אילו תזכורות|מה התזכורות|תזכורות פעילות/.test(t),
      run:t=>{ if(!activeAlarms.length){ respond(t,"אין תזכורות פעילות."); return; }
        respond(t, "יש "+activeAlarms.length+" תזכורות: "+activeAlarms.map(a=>a.label).join(", ")+"."); } },

    // time / date
    { name:'tell_time',
      test:t=>/^(מה השעה|השעה|תגיד לי את השעה|מה הזמן)/.test(t),
      run:t=>{ const d=new Date(); respond(t,"השעה "+String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0')+"."); } },
    { name:'tell_date',
      test:t=>/מה התאריך|איזה יום היום|התאריך|איזה יום$/.test(t),
      run:t=>{ const days=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"]; const d=new Date();
        respond(t, "היום יום "+days[d.getDay()]+", "+d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear()+"."); } },

    // percentages + calculator
    { name:'percent',
      test:t=>{ const n=wordsToDigits(t); const m=n.match(/(\d+(?:\.\d+)?)\s*אחוז\s*(?:מ|מתוך)\s*(\d+(?:\.\d+)?)/); return m?{a:+m[1],b:+m[2]}:false; },
      run:(t,m)=>{ respond(t, m.a+" אחוז מ-"+m.b+" זה "+round(m.a/100*m.b)+"."); } },
    { name:'calc',
      test:t=>{
        if(!/כמה זה|חשב|תחשב|כפול|ועוד|פלוס|מינוס|פחות|חלקי/.test(t) && !/^[\d\s+\-*/().]+$/.test(t)) return false;
        let e = wordsToDigits(t)
          .replace(/כמה זה|תחשב|חשב/g,' ')
          .replace(/כפול/g,'*').replace(/ועוד|פלוס/g,'+')
          .replace(/מינוס|פחות/g,'-').replace(/חלקי|לחלק ל|חלוק ב/g,'/')
          .replace(/[^0-9+\-*/(). ]/g,' ').trim();
        if(!/[0-9]/.test(e) || !/[+\-*/]/.test(e)) return false;
        return { expr:e };
      },
      run:(t,m)=>{
        try{
          const val = Function('"use strict";return('+m.expr+')')();
          respond(t, (typeof val==='number' && isFinite(val)) ? ("התוצאה היא "+round(val)+".") : "לא הצלחתי לחשב את זה.");
        }catch(e){ respond(t,"לא הצלחתי לחשב את זה."); }
      } },

    // random / fun
    { name:'coin', test:t=>/הטל מטבע|זרוק מטבע|עץ או פלי/.test(t),
      run:t=>respond(t, Math.random()<0.5?"יצא עץ.":"יצא פלי.") },
    { name:'dice', test:t=>/הטל קובי|זרוק קובי|קובייה|קוביה/.test(t),
      run:t=>respond(t, "יצא "+(1+Math.floor(Math.random()*6))+".") },
    { name:'random_between',
      test:t=>{ const n=wordsToDigits(t); const m=n.match(/מספר אקראי.*?(\d+)\s*(?:ל|עד|ל-|לבין)\s*(\d+)/); return m?{lo:+m[1],hi:+m[2]}:false; },
      run:(t,m)=>{ const lo=Math.min(m.lo,m.hi),hi=Math.max(m.lo,m.hi); respond(t,"בחרתי "+(lo+Math.floor(Math.random()*(hi-lo+1)))+"."); } },

    // local memory (persists in this browser via localStorage)
    // save a phone number by voice ("תזכור שהמספר של אבא הוא 050...")
    { name:'add_contact',
      test:t=>{ const m=t.match(/(?:המספר|הטלפון)\s+של\s+(\S+)\s+(?:הוא|זה)?\s*([\d\-\s]{6,})/); return m?{name:m[1].replace(/^ה/,''), num:m[2].replace(/\D/g,'')}:false; },
      run:(t,m)=>{ saveContact(m.name, m.num); respond(t, "שמרתי את המספר של "+m.name+"."); } },

    { name:'remember',
      test:t=>{ const m=t.match(/^(?:תזכור ש|זכור ש|תזכור לי ש)(.+)/); return m?{note:m[1].trim()}:false; },
      run:(t,m)=>{ const notes=loadNotes(); notes.push(m.note); saveNotes(notes); respond(t,"אזכור: "+m.note+"."); } },
    { name:'recall',
      test:t=>/מה אתה זוכר|מה ביקשתי שתזכור|מה שמרתי|מה רשמת/.test(t),
      run:t=>{ const notes=loadNotes(); respond(t, notes.length ? ("ביקשת שאזכור: "+notes.join("; ")+".") : "לא ביקשת ממני לזכור כלום עדיין."); } },
    { name:'forget',
      test:t=>/תשכח הכל|תשכח את הכל|מחק את הזיכרון|נקה זיכרון/.test(t),
      run:t=>{ saveNotes([]); respond(t,"מחקתי הכל, התחלנו מדף חלק."); } },

    // voice + look controls
    { name:'speak_slower', test:t=>/דבר לאט|לאט יותר|יותר לאט/.test(t),
      run:t=>{ speechRate=Math.max(0.6,+(speechRate-0.2).toFixed(2)); respond(t,"בסדר, אדבר לאט יותר."); } },
    { name:'speak_faster', test:t=>/דבר מהר|מהר יותר|יותר מהר/.test(t),
      run:t=>{ speechRate=Math.min(1.6,+(speechRate+0.2).toFixed(2)); respond(t,"בסדר, אדבר מהר יותר."); } },
    { name:'change_color',
      test:t=>{ const m=t.match(/(?:שנה|תשנה|החלף).*צבע.*?(תכלת|כחול|סגול|כתום|ירוק|אדום|ורוד)/); return m?{c:m[1]}:false; },
      run:(t,m)=>{ const map={'תכלת':'#3ecbff','כחול':'#0a84ff','סגול':'#a78bfa','כתום':'#ff8a4c','ירוק':'#37e6a0','אדום':'#ff5c7c','ורוד':'#ff8ad0'};
        document.documentElement.style.setProperty('--ring-color',map[m.c]); respond(t,"שיניתי לצבע "+m.c+"."); } },

    // contextual openers (before generic search / open)
    { name:'youtube_search',
      test:t=>{ const m=t.match(/חפש\s+ביוטיוב\s+(.+)/); return m?{q:m[1].trim()}:false; },
      run:(t,m)=>openUrl(t, "https://www.youtube.com/results?search_query="+encodeURIComponent(m.q), "יוטיוב: "+m.q) },
    { name:'translate',
      test:t=>{ const m=t.match(/^תרגם\s+(.+)/); return m?{q:m[1].trim()}:false; },
      run:(t,m)=>openUrl(t, "https://translate.google.com/?sl=auto&tl=he&op=translate&text="+encodeURIComponent(m.q), "תרגום") },
    { name:'navigate',
      test:t=>{ const m=t.match(/(?:נווט|מסלול|הגדר מסלול)\s+(?:ל|אל)\s*(.+)/); return m?{q:m[1].trim()}:false; },
      run:(t,m)=>openUrl(t, "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(m.q), "מסלול ל"+m.q) },
    { name:'images',
      test:t=>{ const m=t.match(/תמונות של\s+(.+)/); return m?{q:m[1].trim()}:false; },
      run:(t,m)=>openUrl(t, "https://www.google.com/search?tbm=isch&q="+encodeURIComponent(m.q), "תמונות של "+m.q) },

    // generic web search
    { name:'web_search',
      test:t=>{ const m=t.match(/^(?:תחפש|חפש|חיפוש)\s+(?:ב\s*גוגל\s+)?(?:את\s+)?(.+)$/); return m?{q:m[1].trim()}:false; },
      run:(t,m)=>openUrl(t, "https://www.google.com/search?q="+encodeURIComponent(m.q), "חיפוש: "+m.q) },

    // open a known site
    // NOTE: sending WhatsApp used to be a brittle Hebrew regex here that only
    // pre-filled the chat and left you to press send. The desktop app does it
    // properly now (resolves the contact, shows you recipient + text, sends on
    // your approval), so this page hands "send a message" to the agent.

    // schedule a real calendar event (opens Google Calendar pre-filled; you press Save)
    { name:'calendar_event',
      test:t=>{
        if(!/(?:קבע|תקבע|קבעי|תזמן|תזמין|תכניס|הוסף).*(?:פגישה|אירוע|תור|יומן)/.test(t)) return false;
        const n = wordsToDigits(t);
        let title = t.replace(/(?:קבע|תקבע|קבעי|תזמן|תזמין|תכניס|הוסף)\s+/,'')
                     .replace(/\b(?:פגישה|אירוע|תור)\b/,'')
                     .replace(/ליומן|ביומן|יומן/,'')
                     .replace(/(?:מחרתיים|מחר|היום)/,'')
                     .replace(/(?:בשעה|ב-?)\s*\d{1,2}(?::\d{2})?/,'')
                     .replace(/\s+/g,' ').trim() || 'אירוע';
        let day = /מחרתיים/.test(t) ? 2 : (/מחר/.test(t) ? 1 : 0);
        let hh = null, mm = 0;
        const hm = n.match(/(?:בשעה|ב-?)\s*(\d{1,2})(?::(\d{2}))?/);
        if(hm){ hh = parseInt(hm[1],10); mm = hm[2]?parseInt(hm[2],10):0; }
        return { title, day, hh, mm };
      },
      run:(t,m)=>{
        let url = "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(m.title);
        if(m.hh!=null){
          const d = new Date(); d.setDate(d.getDate()+m.day); d.setHours(m.hh, m.mm||0, 0, 0);
          const end = new Date(d.getTime()+3600000);
          const fmt = x => x.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
          url += "&dates="+fmt(d)+"/"+fmt(end);
        }
        openUrl(t, url, "יומן: "+m.title);
      } },

    { name:'open_site',
      test:t=>{
        const open=/תפתח|פתח|היכנס ל|תיכנס ל|כנס ל|עבור ל/.test(t);
        for(const app of APP_MAP){
          if(app.keys.some(k=> open ? t.includes(k) : (t===k || t==="ה"+k))) return { url:app.url, label:app.label };
        }
        return false;
      },
      run:(t,m)=>openUrl(t, m.url, m.label) },

    // help / capabilities
    { name:'help',
      test:t=>/מה אתה יכול|מה אתה יודע|עזרה|רשימת פקודות/.test(t),
      run:t=>respond(t, "אני יכול לפתוח אתרים, לחפש בגוגל וביוטיוב, לתרגם, לנווט, לקבוע ולבטל תזכורות, להגיד שעה ותאריך, לחשב, להטיל מטבע או קובייה, לזכור דברים, ולשנות קצב או צבע. פשוט תגיד לי.") }
  ];

  // router: first matching intent wins; returns true if handled locally
  function tryHandleCommand(text){
    const t = text.trim();
    for(const cmd of COMMANDS){
      let m;
      try{ m = cmd.test(t); }catch(e){ m = false; }
      if(m){ try{ cmd.run(t, m); }catch(e){ respond(t,"משהו השתבש בביצוע הפקודה."); } return true; }
    }
    return false;
  }

  // NOTE: speak() already re-arms background listening in wake mode via its onend handler.

  // ---------- visual bars ----------
  const BAR_COUNT = 48;
  const bars = [];
  for(let i=0;i<BAR_COUNT;i++){
    const angle = (i/BAR_COUNT)*Math.PI*2;
    const cx=200, cy=200, r1=192;
    const x1 = cx + r1*Math.cos(angle);
    const y1 = cy + r1*Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('class','bar');
    line.setAttribute('x1',x1);
    line.setAttribute('y1',y1);
    line.setAttribute('x2',x1);
    line.setAttribute('y2',y1);
    line.dataset.angle = angle;
    line.dataset.cx = cx; line.dataset.cy = cy; line.dataset.r1 = r1;
    barsGroup.appendChild(line);
    bars.push(line);
  }

  function setBarLength(len){
    bars.forEach((line, i)=>{
      const angle = parseFloat(line.dataset.angle);
      const cx = parseFloat(line.dataset.cx), cy = parseFloat(line.dataset.cy), r1 = parseFloat(line.dataset.r1);
      const jitter = 0.6 + 0.4*Math.sin(i*1.3 + performance.now()/300);
      const l = Math.max(2, len*jitter);
      const x2 = cx + (r1+l)*Math.cos(angle);
      const y2 = cy + (r1+l)*Math.sin(angle);
      line.setAttribute('x2',x2);
      line.setAttribute('y2',y2);
    });
  }

  let idlePhase = 0;
  function animateIdle(){
    idlePhase += 0.02;
    const len = 5 + 3*Math.sin(idlePhase);
    setBarLength(len);
    rafId = requestAnimationFrame(state==='idle' ? animateIdle : animateAudioReactive);
  }

  function animateAudioReactive(){
    if(analyser){
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let sum=0; for(let i=0;i<data.length;i++) sum+=data[i];
      const avg = sum/data.length; // 0-255
      setBarLength(6 + avg*0.35);
    } else {
      setBarLength(6);
    }
    rafId = requestAnimationFrame(state==='listening' ? animateAudioReactive : animateIdle);
  }
  animateIdle();

  // ---------- state management ----------
  function setState(s){
    state = s;
    orbWrap.className = 'orb-wrap state-' + s;
    if(s==='idle'){
      statusText.textContent = 'מוכן לשמוע אותך';
      hintText.textContent = wakeMode ? "מקשיב ברקע ל\"היי ג'רוויס\"" : (sttSupported ? 'לחץ על העיגול כדי לדבר' : 'כתוב הודעה למטה');
      document.documentElement.style.setProperty('--pulse-speed','3.2s');
    } else if(s==='listening'){
      statusText.textContent = 'מקשיב...';
      hintText.textContent = 'לחץ שוב כדי לעצור';
      document.documentElement.style.setProperty('--pulse-speed','1.4s');
    } else if(s==='thinking'){
      statusText.textContent = 'חושב...';
      hintText.textContent = '';
      document.documentElement.style.setProperty('--pulse-speed','0.9s');
    } else if(s==='speaking'){
      statusText.textContent = 'עונה...';
      hintText.textContent = '';
      document.documentElement.style.setProperty('--pulse-speed','1.1s');
    }
  }

  function addLog(role, text){
    const p = document.createElement('p');
    p.className = role==='user' ? 'me' : 'ai';
    p.textContent = text;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  // ---------- microphone visualizer (best effort) ----------
  async function initMicVisualizer(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      micSource = audioCtx.createMediaStreamSource(stream);
      micSource.connect(analyser);
    }catch(e){
      analyser = null; // graceful degrade, bars will pulse generically
    }
  }

  // ---------- speech recognition ----------
  // micPhase: 'sleep' (listening only for wake phrase) | 'prompting' (said "כן, אני כאן", waiting for TTS to finish)
  //           | 'command' (actively capturing the real request) | 'busy' (handing off to handleUserMessage)
  let micPhase = 'sleep';

  function setupRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'he-IL';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = ()=>{
      recogAlive = true;
      lastRecogStart = Date.now();
      if(!wakeMode || micPhase==='command') setState('listening');
    };
    recognition.onresult = (e)=>{
      let interim='';
      let final='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if(interim||final){
        lastResultAt = Date.now();
        // user is talking during the open conversation window -> keep it open
        if(wakeMode && micPhase==='command'){
          clearTimeout(followUpTimer);
          commandUntil = Date.now() + 120000;
          followUpTimer = setTimeout(()=>{
            if(wakeMode && micPhase==='command'){ disableWakeMode(); }
          }, 120000);
        }
      }
      if(wakeMode && micPhase==='sleep'){
        // sleeping: only ever react to the wake phrase, never forward this as a message
        if(containsWakePhrase(interim) || containsWakePhrase(final)){
          wakeUp();
        }
        return;
      }
      if(wakeMode && micPhase!=='command'){
        // we're mid-transition (prompting/busy) - ignore any stray results
        return;
      }
      if(interim) statusText.textContent = interim;
      if(final){
        const clean = final.trim();
        if(!clean) return;
        clearTimeout(followUpTimer);
        if(wakeMode){
          micPhase = 'busy';
          try{ recognition.stop(); }catch(err){}
        } else {
          try{ recognition.stop(); }catch(err){}
        }
        handleUserMessage(clean);
      }
    };
    recognition.onerror = (e)=>{
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        if(wakeMode && !autoStartArmed){
          armAutoStartRetry();
          return;
        }
        sttSupported = false;
        wakeMode = false;
        wakeToggle.classList.remove('on');
        showFallback('הדפדפן חסם גישה למיקרופון בתצוגה הזו. אפשר לכתוב הודעה למטה, או להוריד את הקובץ ולפתוח אותו ישירות בדפדפן כדי שהקול (וההאזנה התמידית) יעבדו.');
        return;
      }
      if(e.error === 'no-speech' || e.error === 'aborted'){
        if(!wakeMode) setState('idle');
        else if(micPhase==='command' && Date.now() < commandUntil){ restartRecognition(); }
        else if(micPhase==='sleep' || micPhase==='command'){ micPhase='sleep'; armSleepListening(); }
      } else {
        // network / audio-capture / other transient failures: in wake mode force a clean restart
        if(!wakeMode) setState('idle');
        else { recogAlive=false; micPhase='sleep'; clearTimeout(restartTimer); restartTimer = setTimeout(restartRecognition, 600); }
      }
    };
    recognition.onend = ()=>{
      if(wakeMode){
        if(micPhase==='sleep'){
          armSleepListening(); // continuous mode dropped for some reason - restart it
        }
        else if(micPhase==='command'){
          // still inside the 2-minute window? keep the mic alive instead of dropping to sleep
          if(Date.now() < commandUntil){ restartRecognition(); }
          else { micPhase = 'sleep'; armSleepListening(); }
        }
        // 'prompting' and 'busy' phases: do nothing here, another callback owns the next step
      } else if(state==='listening'){
        setState('idle');
      }
    };
  }

  // Chrome's recognition object can silently die after a few stop/start cycles while still
  // *looking* alive to our code. Rebuilding a fresh instance every time we resume listening
  // avoids that "zombie" state and is why it used to only work once per page load.
  function restartRecognition(){
    recogAlive = false;
    lastRecogStart = Date.now();
    try{ recognition.abort(); }catch(e){}
    setupRecognition();
    try{ recognition.start(); }
    catch(e){
      // "already started" or a transient failure -> retry shortly
      clearTimeout(restartTimer);
      restartTimer = setTimeout(()=>{ try{ recognition.start(); }catch(_){ } }, 500);
    }
  }

  function armSleepListening(){
    if(!wakeMode) return;
    micPhase = 'sleep';
    setState('idle');
    hintText.textContent = "מקשיב ברקע ל\"היי ג'רוויס\"";
    clearTimeout(restartTimer);
    restartTimer = setTimeout(restartRecognition, 300);
  }

  // After JARVIS answers, keep the mic open briefly so you can keep talking WITHOUT
  // repeating the wake word. Stay silent and it drops back to background listening.
  let followUpTimer = null;
  function armFollowUp(){
    if(!wakeMode){ setState('idle'); return; }
    clearTimeout(followUpTimer);
    clearTimeout(restartTimer);
    micPhase = 'command';
    setState('idle'); // neutral during the short beat so the watchdog won't double-fire
    // short beat so the mic doesn't catch the tail of JARVIS's own voice, then keep listening
    setTimeout(()=>{
      if(!wakeMode || micPhase!=='command') return;
      setState('listening');
      hintText.textContent = 'ממשיך להקשיב... פשוט תדבר';
      restartRecognition();
      lastResultAt = Date.now();
      // stay in direct-conversation mode for a long window; every time you speak it resets.
      // only after a long real silence do we drop back to wake-word listening.
      clearTimeout(followUpTimer);
      commandUntil = Date.now() + 120000;
      followUpTimer = setTimeout(()=>{
        if(wakeMode && micPhase==='command'){
          disableWakeMode();
        }
      }, 120000);
    }, 500);
  }

  function wakeUp(){
    if(micPhase!=='sleep') return;
    micPhase = 'prompting';
    try{ recognition.stop(); }catch(e){}
    statusText.textContent = 'כן, אני כאן. במה אוכל לעזור?';
    speakThenListen('כן, אני כאן.');
  }

  function speakThenListen(text){
    const go = ()=>{ micPhase = 'command'; setState('listening'); restartRecognition(); lastResultAt = Date.now(); };
    if(!ttsSupported){ go(); return; }
    setState('speaking');
    text = text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}]/gu, '').replace(/\s{2,}/g, ' ').trim();
    const utter = new SpeechSynthesisUtterance(text);
    if(!heVoice) heVoice = pickHebrewVoice();
    if(heVoice) utter.voice = heVoice;
    utter.lang = heVoice ? heVoice.lang : 'he-IL';
    utter.rate = speechRate;
    let done = false;
    const finish = ()=>{ if(done) return; done = true; clearInterval(keepAlive); clearTimeout(fallback); go(); };
    utter.onend = finish;
    utter.onerror = finish;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
    const keepAlive = setInterval(()=>{ try{ if(speechSynthesis.speaking) speechSynthesis.resume(); }catch(e){} }, 4000);
    const fallback = setTimeout(finish, Math.max(2000, text.length*70/speechRate + 1200));
  }

  function showFallback(msg){
    fallback.classList.add('active');
    notice.textContent = msg;
    setState('idle');
  }

  orbWrap.addEventListener('click', ()=>{
    if(state==='thinking' || state==='speaking') return;
    if(!sttSupported){
      textInput.focus();
      return;
    }
    if(wakeMode) return; // in wake mode, mic is already managed automatically
    if(!recognition) setupRecognition();
    if(state==='listening'){
      recognition.stop();
      setState('idle');
    } else {
      if(!audioCtx) initMicVisualizer();
      try{
        recognition.start();
      }catch(err){
        showFallback('לא הצלחתי להפעיל את המיקרופון. כתוב הודעה למטה במקום.');
      }
    }
  });

  function enableWakeMode(){
    if(!sttSupported){
      notice.textContent = 'האזנה תמידית דורשת תמיכה בזיהוי דיבור בדפדפן (מומלץ כרום).';
      return;
    }
    wakeMode = true;
    wakeToggle.classList.add('on');
    wakeToggleLabel.textContent = "האזנה תמידית פעילה (לחץ כדי לעצור)";
    if(!recognition) setupRecognition();
    if(!audioCtx) initMicVisualizer();
    micPhase = 'sleep';
    try{ recognition.stop(); }catch(e){}
    setTimeout(()=>{
      try{ recognition.start(); }catch(e){
        armAutoStartRetry();
      }
    }, 200);
    hintText.textContent = "מקשיב ברקע ל\"היי ג'רוויס\"";
  }

  function disableWakeMode(){
    wakeMode = false;
    wakeToggle.classList.remove('on');
    wakeToggleLabel.textContent = "הפעל האזנה תמידית (מילת עוררות)";
    clearTimeout(restartTimer);
    clearInterval(watchdogTimer);
    micPhase = 'sleep';
    try{ recognition && recognition.stop(); }catch(e){}
    setState('idle');
  }

  // Watchdog: recovers the mic from any stuck state so you never have to refresh.
  let watchdogTimer = null;
  let lastResultAt = Date.now();
  function startWatchdog(){
    clearInterval(watchdogTimer);
    watchdogTimer = setInterval(()=>{
      if(!wakeMode || document.hidden) return;
      if(state==='thinking') return; // brain in flight, leave it alone
      const now = Date.now();
      // (1) "speaking" but synthesis is actually idle -> the onend event was missed
      if(state==='speaking' && !(ttsSupported && (speechSynthesis.speaking || speechSynthesis.pending))){
        armFollowUp(); return;
      }
      // (2) we should be listening but the recognizer is dead -> revive it fast
      if((micPhase==='sleep' || micPhase==='command') && state!=='speaking' && !recogAlive && (now-lastRecogStart) > 2500){
        restartRecognition(); return;
      }
      // (3) background phase but recognizer not alive -> restart
      if(micPhase==='sleep' && !recogAlive){ restartRecognition(); return; }
      // (4) stuck actively listening with no speech for 15s -> back to background
      if(state==='listening' && micPhase==='command' && (now-lastResultAt) > 15000){
        micPhase='sleep'; armSleepListening(); return;
      }
      // (5) stuck in 'busy' (a result was captured but nothing resumed us) -> recover
      if(micPhase==='busy' && (now-lastResultAt) > 12000){
        micPhase='sleep'; armSleepListening(); return;
      }
      // (6) PROACTIVE: Chrome silently stops continuous recognition after ~60s.
      //     While quietly listening, cycle a fresh recognizer every 45s to pre-empt that death.
      if(micPhase==='sleep' && recogAlive && (now-lastRecogStart) > 45000){
        restartRecognition();
      }
    }, 2000);
  }
  startWatchdog();

  // The moment the tab becomes visible/focused again, immediately try to resume listening -
  // this is the best recovery we get after the browser froze us in the background.
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && wakeMode){
      clearTimeout(restartTimer);
      micPhase = 'sleep';
      restartRecognition();
    }
  });

  // Also recover on window focus and when the network reconnects - both can silently kill recognition.
  window.addEventListener('focus', ()=>{
    if(wakeMode && micPhase==='sleep'){ clearTimeout(restartTimer); restartRecognition(); }
  });
  window.addEventListener('online', ()=>{
    if(wakeMode){ clearTimeout(restartTimer); micPhase='sleep'; restartRecognition(); }
  });

  // Some browsers refuse mic access without a direct user gesture the very first time.
  // If auto-start fails, arm a one-time listener on the page so the first tap anywhere enables it.
  let autoStartArmed = false;
  function armAutoStartRetry(){
    if(autoStartArmed) return;
    autoStartArmed = true;
    notice.textContent = 'הדפדפן דורש נגיעה אחת כדי לאשר גישה למיקרופון - געו במסך כדי להפעיל האזנה תמידית.';
    const retry = ()=>{
      document.removeEventListener('click', retry);
      notice.textContent = '';
      enableWakeMode();
    };
    document.addEventListener('click', retry, { once:true });
  }

  wakeToggle.addEventListener('click', ()=>{
    if(wakeMode) disableWakeMode();
    else enableWakeMode();
  });

  if(!sttSupported){
    showFallback('הדפדפן הזה לא תומך בזיהוי דיבור (נסה כרום). אפשר לכתוב הודעה למטה במקום.');
  } else {
    // start listening automatically - no click needed
    enableWakeMode();
  }

  sendBtn.addEventListener('click', sendFromInput);
  textInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendFromInput(); });
  function sendFromInput(){
    const val = textInput.value.trim();
    if(!val) return;
    textInput.value = '';
    handleUserMessage(val);
  }

  // ---------- JARVIS Desktop bridge ----------
  // A browser page cannot touch the operating system. The desktop app can.
  // So when the desktop app is running, this page acts as its ears: Chrome
  // does the Hebrew speech recognition (which does not work inside Electron)
  // and hands the command over localhost to the app, which does the work.
  const DESKTOP_TOKEN_KEY = 'jarvis_desktop_token';
  const DESKTOP_PORT_KEY = 'jarvis_desktop_port';
  let desktopOnline = false;

  function desktopToken(){ try{ return localStorage.getItem(DESKTOP_TOKEN_KEY) || ''; }catch(e){ return ''; } }
  function desktopPort(){ try{ return localStorage.getItem(DESKTOP_PORT_KEY) || '8765'; }catch(e){ return '8765'; } }
  function desktopUrl(path){ return 'http://127.0.0.1:' + desktopPort() + path; }

  function initDesktopUi(){
    const toggle = document.getElementById('desktopToggle');
    const setup = document.getElementById('desktopSetup');
    const input = document.getElementById('desktopTokenInput');
    const btn = document.getElementById('desktopConnectBtn');
    if(!toggle) return;

    toggle.addEventListener('click', ()=>{
      setup.style.display = setup.style.display === 'none' ? '' : 'none';
      if(setup.style.display !== 'none'){ input.value = desktopToken(); input.focus(); }
    });

    async function connect(){
      const t = input.value.trim();
      try{ localStorage.setItem(DESKTOP_TOKEN_KEY, t); }catch(e){}
      const online = await checkDesktop();
      if(online){
        setup.style.display = 'none';
        addLog('assistant', 'מחובר לאפליקציה במחשב. עכשיו אני יכול לשלוט במחשב.');
      }else{
        addLog('assistant', 'לא מצאתי את האפליקציה. ודא שהיא רצה (START-JARVIS.bat) ושהקוד נכון.');
      }
    }
    btn.addEventListener('click', connect);
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') connect(); });

    checkDesktop();
    setInterval(checkDesktop, 15000);
  }

  async function checkDesktop(){
    if(!desktopToken()){ setDesktopStatus(false); return false; }
    try{
      const r = await fetch(desktopUrl('/health'), { method:'GET' });
      setDesktopStatus(r.ok);
      return r.ok;
    }catch(e){ setDesktopStatus(false); return false; }
  }

  function setDesktopStatus(online){
    desktopOnline = online;
    const dot = document.getElementById('desktopDot');
    const label = document.getElementById('desktopLabel');
    if(dot) dot.style.background = online ? '#22c55e' : '#64748b';
    if(label) label.textContent = online ? 'שולט במחשב' : 'לא מחובר למחשב';
  }

  async function sendToDesktop(text){
    const r = await fetch(desktopUrl('/command'), {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Jarvis-Token': desktopToken() },
      body: JSON.stringify({ text, history: history.slice(-20) })
    });
    if(r.status === 401) throw new Error('הקוד לא נכון. העתק אותו מההגדרות של אפליקציית ג\'רביס.');
    if(!r.ok) throw new Error('desktop ' + r.status);
    return r.json();
  }

  // ---------- Claude brain ----------
  async function handleUserMessage(text){
    if(tryHandleCommand(text)){
      return;
    }
    addLog('user', text);
    history.push({role:'user', content:text});
    setState('thinking');

    // Prefer the desktop app — it is the only path that can act on the machine.
    if(desktopOnline || await checkDesktop()){
      try{
        const data = await sendToDesktop(text);
        const reply = (data.reply||'').trim() || 'ביצעתי.';
        history.push({role:'assistant', content:reply});
        addLog('assistant', reply);
        speak(reply);
        return;
      }catch(e){
        setDesktopStatus(false);
        addLog('assistant', 'איבדתי את החיבור לאפליקציה במחשב. ' + (e.message||''));
        speak('איבדתי את החיבור לאפליקציה במחשב.');
        return;
      }
    }

    try{
      const response = await fetch(PROXY_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ messages: history })
      });
      if(!response.ok) throw new Error('proxy '+response.status);
      const data = await response.json();
      const reply = (data.reply||'').trim() || 'לא הצלחתי לנסח תשובה כרגע.';
      history.push({role:'assistant', content:reply});
      addLog('assistant', reply);
      speak(reply);
    }catch(e){
      const explain = 'זו לא פקודה מקומית שאני מכיר, ושיחה חופשית דורשת חיבור לשרת שעדיין לא קיים כאן. תגיד "מה אתה יכול לעשות" ואפרט מה כן עובד.';
      addLog('assistant', explain);
      speak(explain);
    }
  }

  function speak(text){
    if(!ttsSupported){ if(wakeMode) armFollowUp(); else setState('idle'); return; }
    setState('speaking');
    text = text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}]/gu, '').replace(/\s{2,}/g, ' ').trim();
    const utter = new SpeechSynthesisUtterance(text);
    if(!heVoice) heVoice = pickHebrewVoice();
    if(heVoice) utter.voice = heVoice;
    utter.lang = heVoice ? heVoice.lang : 'he-IL';
    utter.rate = speechRate;
    let done = false;
    const finish = ()=>{
      if(done) return; done = true;
      clearInterval(keepAlive); clearTimeout(fallback);
      if(wakeMode) armFollowUp(); else setState('idle');
    };
    utter.onend = finish;
    utter.onerror = finish;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
    // Chrome silently pauses long speech; nudge it. And if onend never fires (a known
    // Chrome bug), this fallback guarantees the mic comes back - no more page refreshing.
    const keepAlive = setInterval(()=>{ try{ if(speechSynthesis.speaking) speechSynthesis.resume(); }catch(e){} }, 4000);
    const fallback = setTimeout(finish, Math.max(2500, Math.min(22000, text.length*70/speechRate + 1500)));
  }

  // warm up voices list (Chrome loads async)
  if(ttsSupported){ speechSynthesis.getVoices(); }

  // ---------- backend reminder polling (persistent reminders set via Claude tool) ----------
  // Every 45s, ask the Worker if any of THIS user's reminders have fired. Speak + log them.
  const JARVIS_USER_ID = 'effi';
  async function pollBackendReminders(){
    try{
      const r = await fetch(PROXY_URL + '/reminders/poll?userId=' + encodeURIComponent(JARVIS_USER_ID));
      if(!r.ok) return;
      const data = await r.json();
      if(data && Array.isArray(data.fired)){
        for(const rem of data.fired){
          const msg = 'תזכורת: ' + rem.text;
          addLog('assistant', msg);
          beep();
          document.documentElement.style.setProperty('--ring-color','#ff8a4c');
          speak('אדוני, ' + msg);
          setTimeout(()=>document.documentElement.style.removeProperty('--ring-color'), 6000);
        }
      }
    }catch(e){/* silent — backend may be down */}
  }
  // First poll after 8s, then every 45s
  setTimeout(pollBackendReminders, 8000);
  setInterval(pollBackendReminders, 45000);

  // ---------- explicit memory commands ----------
  // "תזכור ש..." → send to backend as a memory_write. The Claude tool loop
  // does the actual write server-side, but we also intercept locally so it
  // works as one-shot without opening a long chat.
  const REMEMBER_RE = /^(?:ג'רביס\s+)?תזכור\s+(?:ש|לי\s+ש|לי\s+)?(.+)$/i;
  const RECALL_RE = /^(?:ג'רביס\s+)?(?:מה\s+אתה\s+זוכר|מה\s+יש\s+לך\s+בזיכרון)(?:\s+(?:עלי|עליי|על\s+.+))?\??$/i;
  const FORGET_ALL_RE = /^(?:ג'רביס\s+)?(?:תשכח\s+הכל|תמחק\s+את\s+כל\s+הזיכרון(?:ות)?)\.?$/i;
  const FORGET_RE = /^(?:ג'רביס\s+)?תשכח\s+(.+)$/i;

  async function jarvisChat(text){
    addLog('user', text);
    history.push({role:'user', content:text});
    setState('thinking');
    try{
      const response = await fetch(PROXY_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ messages: history, userId: JARVIS_USER_ID, memory_command: text })
      });
      const data = await response.json();
      const reply = (data.reply||'').trim() || 'לא הצלחתי לנסח תשובה כרגע.';
      history.push({role:'assistant', content:reply});
      addLog('assistant', reply);
      speak(reply);
    }catch(e){
      const explain = 'הבקאנד לא זמין רגע.';
      addLog('assistant', explain);
      speak(explain);
    }
  }

  // Wrap handleUserMessage so memory commands hit backend directly
  const _origHandle = handleUserMessage;
  handleUserMessage = async function(text){
    const t = String(text||'').trim();
    if(FORGET_ALL_RE.test(t)){
      return jarvisChat('שכח הכל מהזיכרון שלי, אבל בקש אישור אם צריך.');
    }
    if(FORGET_RE.test(t)){
      return jarvisChat('תשכח: ' + t.match(FORGET_RE)[1]);
    }
    if(RECALL_RE.test(t)){
      return jarvisChat(t);
    }
    if(REMEMBER_RE.test(t)){
      return jarvisChat(t);
    }
    return _origHandle(text);
  };

  initDesktopUi();
})();
</script>
</body>
</html>
