<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050911;
    --bg2:#0a1424;
    --blue:#3ecbff;
    --blue-deep:#0a84ff;
    --glow:#9df3ff;
    --violet:#a78bfa;
    --text:#eaf6ff;
    --muted:#5f7d99;
    --pulse-speed:3.2s;
    --ring-color:var(--blue);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(ellipse at 50% 30%, var(--bg2) 0%, var(--bg) 65%);
    font-family:'Rubik',sans-serif;
    color:var(--text);
    overflow:hidden;
  }
  .stage{
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:24px;
    position:relative;
  }
  /* faint scanning grid backdrop */
  .stage::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(62,203,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62,203,255,0.05) 1px, transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(ellipse at 50% 40%, black 0%, transparent 70%);
    pointer-events:none;
  }
  .orb-wrap{
    position:relative;
    width:min(66vw, 380px);
    height:min(66vw, 380px);
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .orb-wrap svg{width:100%;height:100%;overflow:visible;}
  .ring{
    fill:none;
    stroke:var(--ring-color);
    transition:stroke 0.6s ease;
  }
  .ring-outer{stroke-width:1.4;opacity:0.4;animation:spin 50s linear infinite;transform-origin:200px 200px;}
  .ring-dots{stroke-width:3;opacity:0.5;stroke-linecap:round;animation:spin 60s linear infinite reverse;transform-origin:200px 200px;}
  .ring-brackets{stroke:var(--ring-color);opacity:0.55;stroke-linecap:round;transition:stroke 0.6s ease;}
  .ring-mid{stroke-width:2;opacity:0.55;animation:spin 22s linear infinite reverse;transform-origin:200px 200px;}
  .ring-inner{stroke-width:2.5;opacity:0.8;animation:spin 14s linear infinite;transform-origin:200px 200px;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .wordmark{
    font-family:'Orbitron',sans-serif;
    font-weight:700;
    font-size:23px;
    letter-spacing:3.5px;
    fill:var(--glow);
    direction:ltr;
    transition:fill 0.6s ease;
  }
  .state-thinking .wordmark{fill:var(--violet);}
  .state-alarm .wordmark{fill:#ff8a4c;}

  .bar{
    stroke:var(--ring-color);
    stroke-width:2.5;
    stroke-linecap:round;
    transition:stroke 0.6s ease;
  }

  .core-glow{
    fill:url(#coreGradient);
    animation:pulse var(--pulse-speed) ease-in-out infinite;
    transform-origin:200px 200px;
  }
  @keyframes pulse{
    0%,100%{transform:scale(0.92);opacity:0.85;}
    50%{transform:scale(1.05);opacity:1;}
  }

  .state-thinking .ring{stroke:var(--violet);}
  .state-thinking .ring-inner{animation-duration:2.5s;}
  .state-thinking .ring-mid{animation-duration:4s;}
  .state-speaking .ring{stroke:var(--glow);}
  .state-listening .ring{stroke:var(--blue);}
  .state-alarm .ring{stroke:#ff8a4c;animation-duration:0.6s !important;}
  .state-alarm .core-glow{animation-duration:0.5s !important;}

  .status{
    font-size:16px;
    font-weight:500;
    letter-spacing:0.5px;
    color:var(--text);
    min-height:22px;
    text-align:center;
  }
  .hint{
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:0.3px;
  }

  .log{
    width:min(92vw, 520px);
    max-height:22vh;
    overflow-y:auto;
    font-size:13.5px;
    line-height:1.6;
    color:var(--muted);
    padding:0 6px;
    scrollbar-width:thin;
  }
  .log::-webkit-scrollbar{width:5px;}
  .log::-webkit-scrollbar-thumb{background:rgba(62,203,255,0.25);border-radius:4px;}
  .log p{margin:4px 0;}
  .log .me{color:var(--blue);}
  .log .me::before{content:"אתה: ";opacity:0.7;}
  .log .ai{color:var(--glow);}
  .log .ai::before{content:"JARVIS: ";opacity:0.7;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:1px;direction:ltr;display:inline-block;}

  .fallback{
    display:none;
    width:min(92vw, 420px);
    gap:8px;
    flex-direction:row;
  }
  .fallback.active{display:flex;}
  .fallback input{
    flex:1;
    background:rgba(62,203,255,0.06);
    border:1px solid rgba(62,203,255,0.3);
    border-radius:10px;
    padding:10px 14px;
    color:var(--text);
    font-family:'Rubik',sans-serif;
    font-size:14px;
    outline:none;
  }
  .fallback input:focus{border-color:var(--blue);}
  .fallback button{
    background:var(--blue-deep);
    border:none;
    border-radius:10px;
    color:#031018;
    font-weight:700;
    padding:0 18px;
    cursor:pointer;
    font-family:'Rubik',sans-serif;
  }
  .notice{
    font-size:11.5px;
    color:var(--muted);
    max-width:min(90vw,420px);
    text-align:center;
    opacity:0.75;
    line-height:1.5;
  }

  .wake-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    padding:6px 12px;
    border:1px solid rgba(62,203,255,0.25);
    border-radius:999px;
    background:rgba(62,203,255,0.04);
    transition:border-color 0.3s, color 0.3s;
  }
  .wake-toggle .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--muted);
    transition:background 0.3s, box-shadow 0.3s;
  }
  .wake-toggle.on{color:var(--blue);border-color:rgba(62,203,255,0.6);}
  .wake-toggle.on .dot{background:var(--blue);box-shadow:0 0 8px var(--blue);animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.35;}}

  .log a.open-link{color:var(--blue);text-decoration:underline;}
</style>
</head>
<body>
<div class="stage">

  <div class="orb-wrap state-idle" id="orbWrap" title="לחץ כדי לדבר">
    <svg viewBox="0 0 400 400">
      <defs>
        <radialGradient id="coreGradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#bdf6ff" stop-opacity="0.35"/>
          <stop offset="45%" stop-color="#3ecbff" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#3ecbff" stop-opacity="0"/>
        </radialGradient>
        <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4.5" result="blur1"/>
          <feMerge>
            <feMergeNode in="blur1"/>
            <feMergeNode in="blur1"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- outer fine tick ring -->
      <circle class="ring ring-outer" cx="200" cy="200" r="188" stroke-dasharray="1.5 6"/>
      <!-- dotted ring -->
      <circle class="ring ring-dots" cx="200" cy="200" r="172" stroke-dasharray="1 11" stroke-width="4"/>
      <!-- corner brackets, four cardinal accents -->
      <g class="ring ring-brackets" stroke-width="3">
        <path d="M 200 8 L 200 26 M 191 12 L 209 12" fill="none"/>
        <path d="M 200 392 L 200 374 M 191 388 L 209 388" fill="none"/>
        <path d="M 8 200 L 26 200 M 12 191 L 12 209" fill="none"/>
        <path d="M 392 200 L 374 200 M 388 191 L 388 209" fill="none"/>
      </g>

      <circle class="ring ring-mid" cx="200" cy="200" r="150" stroke-dasharray="5 9"/>
      <circle class="ring ring-inner" cx="200" cy="200" r="122" stroke-dasharray="26 12"/>
      <g id="bars"></g>
      <circle class="core-glow" cx="200" cy="200" r="95"/>

      <text class="wordmark" x="200" y="207" text-anchor="middle" filter="url(#neonGlow)">J.A.R.V.I.S</text>
    </svg>
  </div>

  <div class="status" id="statusText">מוכן לשמוע אותך</div>
  <div class="hint" id="hintText">לחץ על העיגול כדי לדבר</div>

  <div class="wake-toggle" id="wakeToggle" title="כשמופעל, JARVIS מקשיב ברקע ל&quot;היי ג'רוויס&quot; או &quot;תתעורר&quot;">
    <span class="dot"></span>
    <span id="wakeToggleLabel">הפעל האזנה תמידית (מילת עוררות)</span>
  </div>

  <div class="fallback" id="fallback">
    <input type="text" id="textInput" placeholder="כתוב הודעה ל-JARVIS...">
    <button id="sendBtn">שלח</button>
  </div>

  <div class="log" id="log"></div>

  <div class="notice" id="notice"></div>
</div>

<script>
(function(){
  const orbWrap = document.getElementById('orbWrap');
  const statusText = document.getElementById('statusText');
  const hintText = document.getElementById('hintText');
  const log = document.getElementById('log');
  const barsGroup = document.getElementById('bars');
  const fallback = document.getElementById('fallback');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const notice = document.getElementById('notice');
  const wakeToggle = document.getElementById('wakeToggle');
  const wakeToggleLabel = document.getElementById('wakeToggleLabel');

  const SYSTEM_PROMPT = "אתה JARVIS, עוזר AI חכם, שנון ורגוע בסגנון הסרטים של איירון מן. אתה עונה תמיד בעברית, בקצרה ולעניין (1-3 משפטים בדרך כלל, אלא אם התבקש הסבר ארוך), בביטחון עצמי מסוים ומעט הומור יבש, בלי להיות מוגזם. אתה יכול לפנות למשתמש בכבוד קליל. אל תשתמש באימוג'ים.";

  let history = [];
  let state = 'idle'; // idle | listening | thinking | speaking
  let recognition = null;
  let audioCtx, analyser, micSource, rafId;
  let sttSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  let ttsSupported = 'speechSynthesis' in window;

  // ---------- wake word mode ----------
  let wakeMode = false;       // is "always listening" toggled on
  let restartTimer = null;

  const WAKE_PHRASES = ["היי גרביס","היי ג'רביס","היי ג'רוויס","היי גארוויס","היי ג'ארוויס","ג'רוויס תתעורר","גרביס תתעורר","תתעורר","היי גרוויס","הי גרביס","הייי גרביס"];

  function containsWakePhrase(text){
    const t = text.replace(/\s+/g,' ').trim();
    return WAKE_PHRASES.some(p => t.includes(p));
  }

  // ---------- app / site opening ----------
  const APP_MAP = [
    { keys:["יוטיוב","youtube"], url:"https://www.youtube.com", label:"יוטיוב" },
    { keys:["וואטסאפ","whatsapp","ווצאפ"], url:"https://web.whatsapp.com", label:"וואטסאפ" },
    { keys:["ג'ימייל","gmail","מייל","דואר"], url:"https://mail.google.com", label:"ג'ימייל" },
    { keys:["מפות","נביגציה","ניווט","waze","וויז"], url:"https://www.google.com/maps", label:"מפות גוגל" },
    { keys:["ספוטיפיי","spotify","מוזיקה"], url:"https://open.spotify.com", label:"ספוטיפיי" },
    { keys:["נטפליקס","netflix"], url:"https://www.netflix.com", label:"נטפליקס" },
    { keys:["פייסבוק","facebook"], url:"https://www.facebook.com", label:"פייסבוק" },
    { keys:["אינסטגרם","instagram","אינסטה"], url:"https://www.instagram.com", label:"אינסטגרם" },
    { keys:["וויקיפדיה","wikipedia"], url:"https://he.wikipedia.org", label:"ויקיפדיה" },
    { keys:["דרייב","drive","google drive"], url:"https://drive.google.com", label:"גוגל דרייב" },
    { keys:["קלנדר","יומן","לוח שנה","calendar"], url:"https://calendar.google.com", label:"יומן גוגל" },
    { keys:["קלוד","claude"], url:"https://claude.ai", label:"Claude" }
  ];

  // returns {url,label} for "פתח X" / "תפתח X" / "היכנס ל-X" commands, or a google search for "חפש X"
  function parseCommand(text){
    const t = text.trim();
    const openTriggers = ["תפתח","פתח","היכנס ל","תיכנס ל","כנס ל","עבור ל"];
    const isOpenCmd = openTriggers.some(w => t.startsWith(w) || t.includes(w));
    if(isOpenCmd){
      for(const app of APP_MAP){
        if(app.keys.some(k => t.includes(k))){
          return { type:'open', url:app.url, label:app.label };
        }
      }
    }
    const searchMatch = t.match(/^(?:תחפש|חפש|חיפוש)\s+(?:ב\s*גוגל\s+)?(?:את\s+)?(.+)$/);
    if(searchMatch && searchMatch[1]){
      return { type:'search', url:"https://www.google.com/search?q=" + encodeURIComponent(searchMatch[1].trim()), label:"חיפוש: " + searchMatch[1].trim() };
    }
    // direct app name with no explicit "open" trigger, e.g. just "יוטיוב"
    for(const app of APP_MAP){
      if(app.keys.some(k => t === k || t === "ה"+k)){
        return { type:'open', url:app.url, label:app.label };
      }
    }
    return null;
  }

  function tryHandleCommand(text){
    const alarm = parseAlarm(text);
    if(alarm) return handleAlarmCommand(text, alarm);

    const cmd = parseCommand(text);
    if(!cmd) return false;
    addLog('user', text);
    const win = window.open(cmd.url, '_blank');
    const reply = win ? ("פותח את " + cmd.label + ", אדוני.") : ("ניסיתי לפתוח את " + cmd.label + " אבל הדפדפן חסם את זה. לחץ כאן: ");
    addLog('assistant', reply);
    if(!win){
      const lastP = log.lastElementChild;
      const a = document.createElement('a');
      a.href = cmd.url; a.target = '_blank'; a.className = 'open-link'; a.textContent = cmd.label;
      lastP.appendChild(a);
    }
    history.push({role:'user', content:text});
    history.push({role:'assistant', content:reply});
    speak(reply.replace(/:\s*$/,''));
    return true;
  }

  // ---------- alarms / timers / reminders (fully local, no AI or internet needed) ----------
  const UNIT_MS = { 'שנייה':1000,'שניות':1000,'דקה':60000,'דקות':60000,'שעה':3600000,'שעות':3600000 };
  const activeAlarms = [];

  function parseAlarm(text){
    const t = text.trim();
    const isAlarmWord = /תזכיר|תזכורת|תזכר|טיימר|שעון מעורר|תעיר|עורר אותי|קבע.*תזכורת|שים.*תזכורת|תשים.*תזכורת|עדכן אותי|תעדכן אותי|תדליק תזכורת|נבהל|תצפצף/.test(t);
    if(!isAlarmWord) return null;

    // relative: "בעוד 10 דקות" / "בעוד שעה"
    const rel = t.match(/בעוד\s+(\d+)?\s*(שנייה|שניות|דקה|דקות|שעה|שעות)/);
    if(rel){
      const n = rel[1] ? parseInt(rel[1],10) : 1;
      const unit = rel[2];
      return { ms: n*UNIT_MS[unit], kind:'relative', text:t };
    }
    // absolute: "בשעה 8:00" / "ב-19:30" / "בשעה 8"
    const abs = t.match(/(?:בשעה|ב-?)\s*(\d{1,2})(?::(\d{2}))?/);
    if(abs){
      const hh = parseInt(abs[1],10);
      const mm = abs[2] ? parseInt(abs[2],10) : 0;
      if(hh>=0 && hh<24 && mm>=0 && mm<60){
        const now = new Date();
        const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
        if(target <= now) target.setDate(target.getDate()+1); // if time already passed today, set for tomorrow
        return { ms: target - now, kind:'absolute', text:t, target };
      }
    }
    // no specific time found but it's clearly an alarm-type request
    return { ms:null, kind:'unknown', text:t };
  }

  function handleAlarmCommand(text, alarm){
    addLog('user', text);
    if(alarm.ms == null){
      const reply = "לא הבנתי בדיוק לאיזו שעה. אפשר לומר למשל \"תזכיר לי בעוד 10 דקות\" או \"תזכיר לי בשעה שמונה\".";
      addLog('assistant', reply);
      history.push({role:'user', content:text});
      history.push({role:'assistant', content:reply});
      speak(reply);
      return true;
    }
    const totalMinutes = Math.round(alarm.ms/60000);
    const label = alarm.kind==='absolute'
      ? ("לשעה " + String(alarm.target.getHours()).padStart(2,'0') + ":" + String(alarm.target.getMinutes()).padStart(2,'0'))
      : ("בעוד " + (totalMinutes>=1 ? totalMinutes + " דקות" : Math.round(alarm.ms/1000)+" שניות"));
    const reply = "קבעתי תזכורת " + label + ", אדוני.";
    addLog('assistant', reply);
    history.push({role:'user', content:text});
    history.push({role:'assistant', content:reply});
    speak(reply);

    const timerId = setTimeout(()=>{ fireAlarm(label); }, alarm.ms);
    activeAlarms.push(timerId);
    return true;
  }

  function fireAlarm(label){
    addLog('assistant', "⏰ התזכורת שלך " + label + " הגיעה!");
    beep();
    document.documentElement.style.setProperty('--ring-color','#ff8a4c');
    speak("אדוני, הגיע הזמן. זו התזכורת שביקשת.");
    setTimeout(()=>document.documentElement.style.removeProperty('--ring-color'), 6000);
  }

  function beep(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      g.gain.value=0.15;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
    }catch(e){}
  }
  // NOTE: speak() already re-arms background listening in wake mode via its onend handler.

  // ---------- visual bars ----------
  const BAR_COUNT = 48;
  const bars = [];
  for(let i=0;i<BAR_COUNT;i++){
    const angle = (i/BAR_COUNT)*Math.PI*2;
    const cx=200, cy=200, r1=192;
    const x1 = cx + r1*Math.cos(angle);
    const y1 = cy + r1*Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('class','bar');
    line.setAttribute('x1',x1);
    line.setAttribute('y1',y1);
    line.setAttribute('x2',x1);
    line.setAttribute('y2',y1);
    line.dataset.angle = angle;
    line.dataset.cx = cx; line.dataset.cy = cy; line.dataset.r1 = r1;
    barsGroup.appendChild(line);
    bars.push(line);
  }

  function setBarLength(len){
    bars.forEach((line, i)=>{
      const angle = parseFloat(line.dataset.angle);
      const cx = parseFloat(line.dataset.cx), cy = parseFloat(line.dataset.cy), r1 = parseFloat(line.dataset.r1);
      const jitter = 0.6 + 0.4*Math.sin(i*1.3 + performance.now()/300);
      const l = Math.max(2, len*jitter);
      const x2 = cx + (r1+l)*Math.cos(angle);
      const y2 = cy + (r1+l)*Math.sin(angle);
      line.setAttribute('x2',x2);
      line.setAttribute('y2',y2);
    });
  }

  let idlePhase = 0;
  function animateIdle(){
    idlePhase += 0.02;
    const len = 5 + 3*Math.sin(idlePhase);
    setBarLength(len);
    rafId = requestAnimationFrame(state==='idle' ? animateIdle : animateAudioReactive);
  }

  function animateAudioReactive(){
    if(analyser){
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let sum=0; for(let i=0;i<data.length;i++) sum+=data[i];
      const avg = sum/data.length; // 0-255
      setBarLength(6 + avg*0.35);
    } else {
      setBarLength(6);
    }
    rafId = requestAnimationFrame(state==='listening' ? animateAudioReactive : animateIdle);
  }
  animateIdle();

  // ---------- state management ----------
  function setState(s){
    state = s;
    orbWrap.className = 'orb-wrap state-' + s;
    if(s==='idle'){
      statusText.textContent = 'מוכן לשמוע אותך';
      hintText.textContent = wakeMode ? "מקשיב ברקע ל\"היי ג'רוויס\"" : (sttSupported ? 'לחץ על העיגול כדי לדבר' : 'כתוב הודעה למטה');
      document.documentElement.style.setProperty('--pulse-speed','3.2s');
    } else if(s==='listening'){
      statusText.textContent = 'מקשיב...';
      hintText.textContent = 'לחץ שוב כדי לעצור';
      document.documentElement.style.setProperty('--pulse-speed','1.4s');
    } else if(s==='thinking'){
      statusText.textContent = 'חושב...';
      hintText.textContent = '';
      document.documentElement.style.setProperty('--pulse-speed','0.9s');
    } else if(s==='speaking'){
      statusText.textContent = 'עונה...';
      hintText.textContent = '';
      document.documentElement.style.setProperty('--pulse-speed','1.1s');
    }
  }

  function addLog(role, text){
    const p = document.createElement('p');
    p.className = role==='user' ? 'me' : 'ai';
    p.textContent = text;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  // ---------- microphone visualizer (best effort) ----------
  async function initMicVisualizer(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      micSource = audioCtx.createMediaStreamSource(stream);
      micSource.connect(analyser);
    }catch(e){
      analyser = null; // graceful degrade, bars will pulse generically
    }
  }

  // ---------- speech recognition ----------
  // micPhase: 'sleep' (listening only for wake phrase) | 'prompting' (said "כן, אני כאן", waiting for TTS to finish)
  //           | 'command' (actively capturing the real request) | 'busy' (handing off to handleUserMessage)
  let micPhase = 'sleep';

  function setupRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'he-IL';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = ()=>{
      if(!wakeMode || micPhase==='command') setState('listening');
    };
    recognition.onresult = (e)=>{
      let interim='';
      let final='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if(wakeMode && micPhase==='sleep'){
        // sleeping: only ever react to the wake phrase, never forward this as a message
        if(containsWakePhrase(interim) || containsWakePhrase(final)){
          wakeUp();
        }
        return;
      }
      if(wakeMode && micPhase!=='command'){
        // we're mid-transition (prompting/busy) - ignore any stray results
        return;
      }
      if(interim) statusText.textContent = interim;
      if(final){
        const clean = final.trim();
        if(!clean) return;
        if(wakeMode){
          micPhase = 'busy';
          try{ recognition.stop(); }catch(err){}
        } else {
          try{ recognition.stop(); }catch(err){}
        }
        handleUserMessage(clean);
      }
    };
    recognition.onerror = (e)=>{
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        if(wakeMode && !autoStartArmed){
          armAutoStartRetry();
          return;
        }
        sttSupported = false;
        wakeMode = false;
        wakeToggle.classList.remove('on');
        showFallback('הדפדפן חסם גישה למיקרופון בתצוגה הזו. אפשר לכתוב הודעה למטה, או להוריד את הקובץ ולפתוח אותו ישירות בדפדפן כדי שהקול (וההאזנה התמידית) יעבדו.');
        return;
      }
      if(e.error === 'no-speech' || e.error === 'aborted'){
        if(!wakeMode) setState('idle');
        // in wake mode, onend below decides whether to restart
      } else {
        if(!wakeMode) setState('idle');
      }
    };
    recognition.onend = ()=>{
      if(wakeMode){
        if(micPhase==='sleep'){
          armSleepListening(); // continuous mode dropped for some reason - restart it
        }
        else if(micPhase==='command'){
          // command capture ended with no final speech captured -> go back to sleep
          micPhase = 'sleep';
          armSleepListening();
        }
        // 'prompting' and 'busy' phases: do nothing here, another callback owns the next step
      } else if(state==='listening'){
        setState('idle');
      }
    };
  }

  // Chrome's recognition object can silently die after a few stop/start cycles while still
  // *looking* alive to our code. Rebuilding a fresh instance every time we resume listening
  // avoids that "zombie" state and is why it used to only work once per page load.
  function restartRecognition(){
    try{ recognition.abort(); }catch(e){}
    setupRecognition();
    try{ recognition.start(); }catch(e){}
  }

  function armSleepListening(){
    if(!wakeMode) return;
    micPhase = 'sleep';
    setState('idle');
    hintText.textContent = "מקשיב ברקע ל\"היי ג'רוויס\"";
    clearTimeout(restartTimer);
    restartTimer = setTimeout(restartRecognition, 300);
  }

  function wakeUp(){
    if(micPhase!=='sleep') return;
    micPhase = 'prompting';
    try{ recognition.stop(); }catch(e){}
    statusText.textContent = 'כן, אני כאן. במה אוכל לעזור?';
    speakThenListen('כן, אני כאן.');
  }

  function speakThenListen(text){
    if(!ttsSupported){
      micPhase = 'command';
      setState('listening');
      restartRecognition();
      return;
    }
    setState('speaking');
    const utter = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const heVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('he'));
    if(heVoice) utter.voice = heVoice;
    utter.lang = heVoice ? heVoice.lang : 'he-IL';
    utter.onend = ()=>{
      micPhase = 'command';
      setState('listening');
      restartRecognition();
    };
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }

  function showFallback(msg){
    fallback.classList.add('active');
    notice.textContent = msg;
    setState('idle');
  }

  orbWrap.addEventListener('click', ()=>{
    if(state==='thinking' || state==='speaking') return;
    if(!sttSupported){
      textInput.focus();
      return;
    }
    if(wakeMode) return; // in wake mode, mic is already managed automatically
    if(!recognition) setupRecognition();
    if(state==='listening'){
      recognition.stop();
      setState('idle');
    } else {
      if(!audioCtx) initMicVisualizer();
      try{
        recognition.start();
      }catch(err){
        showFallback('לא הצלחתי להפעיל את המיקרופון. כתוב הודעה למטה במקום.');
      }
    }
  });

  function enableWakeMode(){
    if(!sttSupported){
      notice.textContent = 'האזנה תמידית דורשת תמיכה בזיהוי דיבור בדפדפן (מומלץ כרום).';
      return;
    }
    wakeMode = true;
    wakeToggle.classList.add('on');
    wakeToggleLabel.textContent = "האזנה תמידית פעילה (לחץ כדי לעצור)";
    if(!recognition) setupRecognition();
    if(!audioCtx) initMicVisualizer();
    micPhase = 'sleep';
    try{ recognition.stop(); }catch(e){}
    setTimeout(()=>{
      try{ recognition.start(); }catch(e){
        armAutoStartRetry();
      }
    }, 200);
    hintText.textContent = "מקשיב ברקע ל\"היי ג'רוויס\"";
  }

  function disableWakeMode(){
    wakeMode = false;
    wakeToggle.classList.remove('on');
    wakeToggleLabel.textContent = "הפעל האזנה תמידית (מילת עוררות)";
    clearTimeout(restartTimer);
    clearInterval(watchdogTimer);
    micPhase = 'sleep';
    try{ recognition && recognition.stop(); }catch(e){}
    setState('idle');
  }

  // Watchdog: every 5s, if we're supposed to be listening but the recognizer silently
  // died (common after long silence, tab throttling, or transient errors), restart it.
  let watchdogTimer = null;
  let lastResultAt = Date.now();
  function startWatchdog(){
    clearInterval(watchdogTimer);
    watchdogTimer = setInterval(()=>{
      if(!wakeMode) return;
      if(document.hidden) return; // tab not visible - browser has throttled us, nothing we can do until it's back
      if(micPhase==='sleep' && state==='idle'){
        restartRecognition();
      }
    }, 5000);
  }
  startWatchdog();

  // The moment the tab becomes visible/focused again, immediately try to resume listening -
  // this is the best recovery we get after the browser froze us in the background.
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && wakeMode){
      clearTimeout(restartTimer);
      micPhase = 'sleep';
      restartRecognition();
    }
  });

  // Some browsers refuse mic access without a direct user gesture the very first time.
  // If auto-start fails, arm a one-time listener on the page so the first tap anywhere enables it.
  let autoStartArmed = false;
  function armAutoStartRetry(){
    if(autoStartArmed) return;
    autoStartArmed = true;
    notice.textContent = 'הדפדפן דורש נגיעה אחת כדי לאשר גישה למיקרופון - געו במסך כדי להפעיל האזנה תמידית.';
    const retry = ()=>{
      document.removeEventListener('click', retry);
      notice.textContent = '';
      enableWakeMode();
    };
    document.addEventListener('click', retry, { once:true });
  }

  wakeToggle.addEventListener('click', ()=>{
    if(wakeMode) disableWakeMode();
    else enableWakeMode();
  });

  if(!sttSupported){
    showFallback('הדפדפן הזה לא תומך בזיהוי דיבור (נסה כרום). אפשר לכתוב הודעה למטה במקום.');
  } else {
    // start listening automatically - no click needed
    enableWakeMode();
  }

  sendBtn.addEventListener('click', sendFromInput);
  textInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendFromInput(); });
  function sendFromInput(){
    const val = textInput.value.trim();
    if(!val) return;
    textInput.value = '';
    handleUserMessage(val);
  }

  // ---------- Claude brain ----------
  async function handleUserMessage(text){
    if(tryHandleCommand(text)){
      return;
    }
    addLog('user', text);
    history.push({role:'user', content:text});
    setState('thinking');
    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system: SYSTEM_PROMPT,
          messages: history
        })
      });
      const data = await response.json();
      const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
      const reply = textBlocks.join('\n').trim() || 'לא הצלחתי לנסח תשובה כרגע.';
      history.push({role:'assistant', content:reply});
      addLog('assistant', reply);
      speak(reply);
    }catch(e){
      const explain = 'לא זיהיתי את זה כפקודה, ושיחה חופשית לא זמינה כאן. נסה למשל: "תפתח יומן", "תזכיר לי בעוד 10 דקות", או "תזכיר לי בשעה 8:00".';
      addLog('assistant', explain);
      speak(explain);
    }
  }

  function speak(text){
    if(!ttsSupported){
      setState('idle');
      return;
    }
    setState('speaking');
    const utter = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const heVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('he'));
    if(heVoice) utter.voice = heVoice;
    utter.lang = heVoice ? heVoice.lang : 'he-IL';
    utter.rate = 1.02;
    utter.onend = ()=>{ wakeMode ? armSleepListening() : setState('idle'); };
    utter.onerror = ()=>{ wakeMode ? armSleepListening() : setState('idle'); };
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }

  // warm up voices list (Chrome loads async)
  if(ttsSupported){ speechSynthesis.getVoices(); }
})();
</script>
</body>
</html>
